<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Cachorros</title>
</head>
<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background-color: #fff5f7;
        text-align: center;
        font-size: 20px;
        font-family: Arial, sans-serif;
        color: #604653;
        padding: 30px;
    }

    h1 {
        font-family: cursive;
        font-size: 50px;
        color: #d66b91;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.15);
        margin-bottom: 30px;
    }

 
    select, input {
        padding: 10px;
        border: 2px solid #f2bfd0;
        border-radius: 10px;
        background-color: white;
        color: #604653;
        font-size: 16px;
        margin: 5px;
    }

    button {
        background-color: #e88eae;
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 20px;
        font-size: 16px;
        margin: 10px 5px;
        cursor: pointer;
    }

    #mensagem {
        margin: 20px;
        color: #bd6689;
    }

    #galeria {
        margin-top: 25px;
    }
</style>

<body>
    <h1> ۪۪  ⡞⠳⣄⣀⣠⠞⢷ ֹGaleria de Cachorros ⡞⠳⣄⣀⣠⠞⢷ ֹ۪</h1>


    <label for="racas">
        <select id="racas">
            <option value="">Selecione uma raça</option>
        </select>
    </label>

    <label for="quantidade">
        <input type="number" id="quantidade" min="1" max="10" value="3">
    </label>

    <button id="aleatorios">Mostrar aleatórios</button>
    <button id="porRaca">Mostrar 3 da raça</button>

    <p id="mensagem"></p>

    <div id="galeria"></div>

    <script src="script.js"></script>
</body>

</html>
